openapi: 3.1.0
info:
  title: Workable Accounts Departments API
  description: 'REST API for Workable''s recruiting and HR platform — manage jobs, candidates,

    employees, departments, members, offers, requisitions, time tracking, time off,

    review cycles, and subscriptions.

    '
  version: 3.21.0
  contact:
    name: Workable
    url: https://workable.readme.io/
servers:
- url: https://{subdomain}.workable.com/spi/v3
  description: Workable API
  variables:
    subdomain:
      default: example
      description: Workable account subdomain
security:
- bearerAuth: []
tags:
- name: Departments
paths:
  /departments:
    get:
      tags:
      - Departments
      summary: List departments
      operationId: listDepartments
      responses:
        '200':
          description: OK
    post:
      tags:
      - Departments
      summary: Create department
      operationId: createDepartment
      responses:
        '201':
          description: Created
    put:
      tags:
      - Departments
      summary: Update department
      operationId: updateDepartment
      responses:
        '200':
          description: OK
  /departments/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    delete:
      tags:
      - Departments
      summary: Delete department
      operationId: deleteDepartment
      responses:
        '204':
          description: No Content
  /departments/{id}/merge:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    post:
      tags:
      - Departments
      summary: Merge departments
      operationId: mergeDepartments
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Workable API token authentication using Bearer token in Authorization header.

        Token types include account tokens, user tokens, and API access tokens.

        '
