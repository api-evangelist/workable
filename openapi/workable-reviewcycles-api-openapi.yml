openapi: 3.1.0
info:
  title: Workable Accounts ReviewCycles API
  description: 'REST API for Workable''s recruiting and HR platform — manage jobs, candidates,

    employees, departments, members, offers, requisitions, time tracking, time off,

    review cycles, and subscriptions.

    '
  version: 3.21.0
  contact:
    name: Workable
    url: https://workable.readme.io/
servers:
- url: https://{subdomain}.workable.com/spi/v3
  description: Workable API
  variables:
    subdomain:
      default: example
      description: Workable account subdomain
security:
- bearerAuth: []
tags:
- name: ReviewCycles
paths:
  /review-cycles/templates:
    get:
      tags:
      - ReviewCycles
      summary: List review cycle templates
      operationId: listReviewCycleTemplates
      responses:
        '200':
          description: OK
    post:
      tags:
      - ReviewCycles
      summary: Create review cycle template
      operationId: createReviewCycleTemplate
      responses:
        '201':
          description: Created
  /review-cycles/templates/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    get:
      tags:
      - ReviewCycles
      summary: Get review cycle template
      operationId: getReviewCycleTemplate
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Workable API token authentication using Bearer token in Authorization header.

        Token types include account tokens, user tokens, and API access tokens.

        '
