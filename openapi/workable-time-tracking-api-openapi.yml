openapi: 3.2.0
info:
  title: Workable Time Tracking API
  description: 'REST API for Workable''s recruiting and HR platform — manage jobs, candidates,

    employees, departments, members, offers, requisitions, time tracking, time off,

    review cycles, and subscriptions.'
  version: 3.21.0
  contact:
    name: Workable
    url: https://workable.readme.io/
servers:
- url: https://{subdomain}.workable.com/spi/v3
  description: Workable API
  variables:
    subdomain:
      default: example
      description: Workable account subdomain
security:
- bearerAuth: []
tags:
- name: Time Tracking
paths:
  /time-tracking/time-entries:
    get:
      tags:
      - Time Tracking
      summary: List time entries
      operationId: listTimeEntries
      responses:
        '200':
          description: OK
    post:
      tags:
      - Time Tracking
      summary: Create time entry
      operationId: createTimeEntry
      responses:
        '201':
          description: Created
  /time-tracking/employees/{id}/time-entries:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    post:
      tags:
      - Time Tracking
      summary: Create employee time entry
      operationId: createEmployeeTimeEntry
      responses:
        '201':
          description: Created
  /time-tracking/employees/{id}/time-entries/{uuid}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    - in: path
      name: uuid
      required: true
      schema:
        type: string
    put:
      tags:
      - Time Tracking
      summary: Update employee time entry
      operationId: updateEmployeeTimeEntry
      responses:
        '200':
          description: OK
    delete:
      tags:
      - Time Tracking
      summary: Delete employee time entry
      operationId: deleteEmployeeTimeEntry
      responses:
        '204':
          description: No Content
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Workable API token authentication using Bearer token in Authorization header.

        Token types include account tokens, user tokens, and API access tokens.

        '
